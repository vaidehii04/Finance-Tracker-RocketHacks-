<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly Roommate Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Page 1: Roommates -->
    <div class="container" id="page1">
        <h1>Spendly</h1>
        <h2>How many roommates?</h2>
        <input type="number" id="roommate-count" min="1" placeholder="Enter number of roommates">
        <button id="page1-next">Next</button>
    </div>

    <!-- Page 2: Add Expenses -->
    <div class="container hidden" id="page2">
        <h2>Add Expenses</h2>

        <input type="text" id="expense-title" placeholder="Expense Category">
        <input type="number" id="expense-amount" placeholder="Amount">
        <input type="text" id="expense-date" placeholder="Date (MM/DD)">
        <input type="text" id="paid-by" placeholder="Who paid? (Name)">

        <button id="add-expense">Add Expense</button>

        <ul id="expense-list"></ul>

        <button id="page2-next">Next</button>
        <button id="back-to-page1">Back</button>

        <!-- AI BOX -->
        <div class="ai-box">
            <h3>Spendly AI Assistant</h3>
            <div id="chat-output"></div>
            <input type="text" id="chat-input" placeholder="Ask about your expenses...">
            <button id="chat-send">Ask AI</button>
        </div>
    </div>

    <!-- Page 3: Summary -->
    <div class="container hidden" id="page3">
        <h2>Summary</h2>
        <div id="summary-list"></div>
        <div class="total" id="split-total"></div>
        <canvas id="expenseChart"></canvas>
        <button id="back-to-page2">Back</button>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
