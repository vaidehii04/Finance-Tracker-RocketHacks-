<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spendly</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">

<h1>Welcome to Spendly</h1>

<p class="subtitle">Smart roommate expense tracking</p>

<button id="startBtn" class="main-btn">Let's Get Your Finances Right</button>

</div>


<!-- PAGE 2 -->
<div class="page" id="page2">

<button class="backBtn" onclick="goBack(1)">← Back</button>

<h2>Number of Roommates</h2>

<input type="number" id="roommateCount" placeholder="Enter number">

<button class="main-btn" onclick="createRoommateInputs()">OK</button>

<div id="roommateInputs"></div>

<button id="roommateNext" class="main-btn hidden" onclick="goToExpenses()">Continue</button>

</div>


<!-- PAGE 3 -->
<div class="page" id="page3">

<button class="backBtn" onclick="goBack(2)">← Back</button>

<h2>Add Expenses</h2>

<div id="expenseContainer"></div>

<button id="addExpenseBtn" class="plusBtn">+</button>

<button class="main-btn" onclick="showSummary()">OK</button>

</div>


<!-- PAGE 4 -->
<div class="page" id="page4">

<button class="backBtn" onclick="goBack(3)">← Back</button>

<h2>Summary</h2>

<div id="summary"></div>

<div id="splitResult"></div>

<button class="main-btn" onclick="createChart()">Create Chart</button>

<canvas id="expenseChart"></canvas>

</div>


<script src="script.js"></script>
<button id="chatToggleBtn" class="chat-toggle">💬 Ask Spendly AI</button>

<div id="chatPanel" class="chat-panel hidden" aria-live="polite">
  <div class="chat-header">
    <h3>Spendly AI Advisor</h3>
    <button id="chatCloseBtn" class="chat-close">✕</button>
  </div>
  <div id="chatMessages" class="chat-messages">
    <div class="chat-message assistant">
      Hi! I can help with student-friendly financial advice based on your spending.
    </div>
  </div>
  <div class="chat-input-row">
    <input
      id="chatInput"
      type="text"
      placeholder="Ask about saving, budgeting, or spending habits..."
    >
    <button id="chatSendBtn" class="main-btn">Send</button>
  </div>
</div>
</body>
</html>
